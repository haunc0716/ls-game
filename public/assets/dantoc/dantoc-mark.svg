<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cf" />
      <stop offset="60%" stop-color="#f5cc5b" />
      <stop offset="100%" stop-color="#c98a1c" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcedaa" />
      <stop offset="50%" stop-color="#d99f2b" />
      <stop offset="100%" stop-color="#9e6611" />
    </linearGradient>
  </defs>
  <!-- Concentric Dong Son Circles -->
  <circle cx="100" cy="100" r="94" stroke="url(#goldRing)" stroke-width="3" />
  <circle cx="100" cy="100" r="88" stroke="#f5cc5b" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8" />
  <circle cx="100" cy="100" r="82" stroke="url(#goldRing)" stroke-width="2" />
  <circle cx="100" cy="100" r="74" stroke="#fcedaa" stroke-width="1.2" opacity="0.6" />
  <circle cx="100" cy="100" r="42" stroke="url(#goldRing)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="14" fill="url(#sunGlow)" />
  
  <!-- 14-Pointed Dong Son Sun Rays -->
  <g transform="translate(100,100)" fill="url(#sunGlow)">
    <!-- 14 rays spaced at 360/14 = 25.714 deg -->
    <polygon points="0,-40 6,-14 -6,-14" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(25.714)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(51.428)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(77.142)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(102.856)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(128.57)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(154.284)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(180)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(205.714)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(231.428)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(257.142)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(282.856)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(308.57)" />
    <polygon points="0,-40 6,-14 -6,-14" transform="rotate(334.284)" />
  </g>

  <!-- Triangle Sawtooth Pattern on Outer Ring -->
  <g transform="translate(100,100)" stroke="url(#goldRing)" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M-6,-78 L0,-84 L6,-78" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(30)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(60)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(90)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(120)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(150)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(180)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(210)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(240)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(270)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(300)" />
    <path d="M-6,-78 L0,-84 L6,-78" transform="rotate(330)" />
  </g>
</svg>
